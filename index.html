  for(const p of pipes){p.x-=2.6;
   if(!p.c&&p.x+PW<BX-R){p.c=1;score++}
   if(!p.k&&Math.hypot(p.x+PW/2-BX,p.gy-by)<R+11){p.k=1;S.coins++;run++;snd(900,.15,'sine')}

  pipes=pipes.filter(p=>p.x>-90);
  if(by+R>GY){by=GY-R;die()}}
 if(st==='over'&&by+R<GY){bv+=.6;by=Math.min(GY-R,by+bv)}
}

}

 const L=tab==='b'?BIRDS:tab==='t'?THEMES:PIPES,own=tab==='b'?S.ob:tab==='t'?S.ot:S.op,cur=tab==='b'?S.bird:tab==='t'?S.theme:S.pipe,np=Math.ceil(L.length/6),

function sbOn(){return typeof SB_URL==='string'&&SB_URL.indexOf('http')===0&&SB_URL.indexOf('PUT_')<0&&SB_KEY.length>20&&SB_KEY.indexOf('PUT_')<0}
async function sb(fn,args){const r=await fetch(SB_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(args)});if(!r.ok){let m='';try{m=(await r.text()).slice(0,120)}catch(_){}throw new Error('HTTP '+r.status+' '+m)}return r.json()}
function pdata(){return{coins:S.coins|0,best:S.best|0,bird:S.bird|0,theme:S.theme|0,ob:S.ob||[0],ot:S.ot||[0],pipe:S.pipe|0,op:S.op||[0]}}
var _sct=0;

document.addEventListener('visibilitychange',()=>{if(document.hidden)pushNow()});
setTimeout(()=>{if(S.name&&S.ph&&!S.owner)pushNow()},2500);

function askName(){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#000b;font-family:Cairo,Tahoma,sans-serif';
 const inp='width:100%;box-sizing:border-box;font:700 20px Cairo,Tahoma,sans-serif;text-align:center;padding:10px;margin-bottom:10px;border:3px solid #e07b00;border-radius:14px;background:#fff;color:#4a2a10';
 d.innerHTML=`<div style='width:min(88vw,330px);background:#fff7e0;border:4px solid #e07b00;border-radius:22px;padding:20px;text-align:center;color:#4a2a10'><div style='font-size:25px;font-weight:900'>أهلاً بيك يا طيّار!</div><div style='margin:6px 0 14px;font-size:14px;font-weight:700;line-height:1.5'>اكتب اسمك وباسورد بسيط. لو رجعت بنفس الاسم والباسورد من أي جهاز، تقدّمك يرجعلك.</div><input id='nmi' maxlength='14' autocomplete='off' placeholder='اسم اللاعب' style='${inp}'><input id='nmp' type='password' maxlength='20' autocomplete='off' placeholder='الباسورد (4 حروف أو أرقام على الأقل)' style='${inp}'><div id='nme' style='min-height:24px;margin:2px 0 8px;color:#b3261e;font-size:14px;font-weight:700'></div><button id='nmb' style='width:100%;font:900 22px Cairo,Tahoma,sans-serif;color:#fff;text-shadow:0 2px 0 #8a4a00;padding:10px;border:3px solid #b36200;border-radius:16px;background:linear-gradient(#ffe066,#ffc21a 50%,#f59a00);box-shadow:0 4px 0 #b36200'>ادخل اللعبة</button></div>`;
 document.body.appendChild(d);ownerUI(d);const i=d.querySelector('#nmi'),p=d.querySelector('#nmp'),e=d.querySelector('#nme'),b=d.querySelector('#nmb');i.value=S.name||'';
 const go=async()=>{const n=i.value.replace(/\s+/g,' ').trim(),pw=p.value;
  if(n.length<2){e.textContent='الاسم لازم حرفين على الأقل';return}
  if(pw.length<4){e.textContent='الباسورد لازم 4 حروف أو أرقام على الأقل';return}
  b.disabled=true;e.style.color='#4a2a10';e.textContent='ثانية واحدة...';
  const h=await hpw(n,pw);
  if(sbOn()){try{const r=await sb('player_login',{p_key:nkey(n),p_name:n,p_hash:h,p_data:pdata()});
    if(r.status==='wrong_password'){e.style.color='#b3261e';e.textContent='الاسم ده مسجّل والباسورد غلط';b.disabled=false;return}
